<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request policy</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { max-width: 560px; padding: 24px; margin: auto; }
  label { display: block; margin: 20px 0 6px; }
  input, button { font: inherit; padding: 10px; }
  input { width: 100%; box-sizing: border-box; }
  button { margin: 20px 8px 0 0; cursor: pointer; }
  #status { min-height: 40px; overflow-wrap: anywhere; }
</style>
<h1>Request policy</h1>
<p>Limit output tokens on matching OpenAI requests. A rejected request never reaches the upstream provider.</p>
<label for="limit">Maximum output tokens</label>
<input id="limit" type="number" min="1" max="1000000" value="1024">
<label for="model">Reject this exact model (optional)</label>
<input id="model" type="text" maxlength="128" autocomplete="off">
<button id="save" type="button" disabled>Save</button>
<button id="test" type="button" disabled>Save and test</button>
<p id="status" role="status" aria-live="polite">Loading configuration…</p>
<script src="app.js"></script>
</html>
